<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9 Dart Century</title>
  <meta name="description" content="9 Dart Century dart game web app with multiplayer scoring, board selector, undo, and scoreboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1115;
      --bg-2: #171a20;
      --panel: #12151b;
      --panel-2: rgba(255, 255, 255, .05);
      --line: rgba(255, 255, 255, .1);
      --text: #f4f0e8;
      --muted: #a8adb8;
      --red: #d14b42;
      --green: #84c07a;
      --gold: #ddb768;
      --cream: #f3e7ce;
      --teal: #1a3a3a;
      --teal-bright: #20c997;
      --purple: #6f42c1;
      --orange: #fd7e14;
      --shadow: 0 20px 60px rgba(0, 0, 0, .35);
      --radius: 22px;
      --radius-sm: 14px;
      --max: 1440px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      max-width: var(--max);
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    h1, h2, h3, .brand {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
      color: var(--gold);
    }
    main {
      width: 100%;
      max-width: var(--max);
      padding: 32px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .panel {
      background-color: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .btn-primary {
      background-color: var(--purple);
      color: var(--text);
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .setup-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 500px;
    }
    .randomize-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
      color: var(--muted);
    }
    .randomize-container input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--orange);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>9 Dart Century</h1>
    <div class="brand">Hellcastle Games</div>
  </header>

  <main>
    <!-- Game Setup Panel -->
    <div id="setupPanel" class="panel">
      <h2>Game Setup</h2>
      <div class="setup-group">
        <div id="playerListContainer">
          <!-- Dynamic Player inputs would go here -->
          <p>Players: <span id="playerNamesDisplay">Kathy, Herb, Kelly</span></p>
        </div>

        <!-- NEW: Randomize Order Checkbox -->
        <label class="randomize-container">
          <input type="checkbox" id="randomizePlayers">
          <span>Randomize player order on start</span>
        </label>

        <button id="startButton" class="btn-primary">Start Game</button>
      </div>
    </div>

    <!-- Active Game Panel (Hidden initially or dynamic) -->
    <div id="gamePanel" class="panel" style="display:none;">
      <h2>Scoreboard</h2>
      <div id="activePlayersScoreboard"></div>
    </div>
  </main>

  <script>
    // Sample mock player data structure
    let players = [
      { name: 'Herb', score: 0 },
      { name: 'Kathy', score: 0 },
      { name: 'Kelly', score: 0 }
    ];

    document.getElementById('startButton').addEventListener('click', () => {
      const randomizeCheckbox = document.getElementById('randomizePlayers');

      // Check if randomization is enabled, then apply Fisher-Yates Shuffle
      if (randomizeCheckbox && randomizeCheckbox.checked && players.length > 1) {
        for (let i = players.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [players[i], players[j]] = [players[j], players[i]];
        }
      }

      // Transition to game view / initialize match
      document.getElementById('setupPanel').style.display = 'none';
      document.getElementById('gamePanel').style.display = 'block';

      // Render updated order to scoreboard
      const scoreboard = document.getElementById('activePlayersScoreboard');
      scoreboard.innerHTML = `<ul>` + players.map(p => `<li>${p.name}</li>`).join('') + `</ul>`;
      
      console.log("Game started with player order:", players.map(p => p.name));
    });
  </script>
</body>
</html>
